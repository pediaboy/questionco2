name: Fast Signal Ping

# 2026-07-27: GitHub's scheduler itself was found to delay a "*/2 * * * *" cron by
# 1-4 HOURS on this public/low-traffic repo (well-documented GH Actions behavior --
# very frequent schedules get deprioritized). A schedule that fires every few
# minutes is fundamentally unreliable here, no matter what interval we pick.
#
# Fix: only the JOB START depends on GH's scheduler now (fires every 4h, a coarse
# cadence much less likely to be starved) -- once a job actually starts, it stops
# depending on the scheduler entirely and self-loops internally (bash while+sleep)
# hitting the tick endpoint every 20s for ~5h50m before exiting. Since each job
# outlives the 4h gap to the next scheduled start, windows overlap and there should
# be no dead time even if a given scheduled start is itself delayed by a couple
# hours. Hits the debounced no-secret GET (same one the dashboard's client-side
# heartbeat uses, see lib/useSignalHeartbeat.ts) so overlapping loops/users never
# cause duplicate OKX/Supabase load -- the endpoint just returns {skipped:true}
# if another tick already ran <12s ago.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Long-poll the auto-signal tick endpoint every 20s for ~5h50m
        continue-on-error: true
        run: |
          END=$((SECONDS + 350*60))
          while [ $SECONDS -lt $END ]; do
            curl -s "https://lastquestion.store/api/cron/auto-signal" \
              --max-time 55 -o /dev/null -w "HTTP %{http_code}\n" || true
            sleep 20
          done
