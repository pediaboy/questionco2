name: Daily Recap Backup

# Owner request 2026-07-29 ("malem rekap harian harus bagus wr nya"): discovered
# the Base44-scheduled "Auto Signal Daily Recap" workflow has been silently
# CANCELLED by the platform every single day since 2026-07-22 (7 straight days,
# 0 steps run each time -- same "Base44 intermittently blocks/cancels scheduled
# cron jobs" issue already hit with the signal engine itself). The recap Telegram
# message has effectively not been sent in over a week. Same fix pattern as
# fast-signal-ping.yml: a GitHub Actions daily cron as an independent backup that
# doesn't depend on Base44's scheduler at all.
#
# UPDATE 2026-08-06 (owner: "rekap signal itu dikirim jam 23.00 bukan jam 1
# malem"): GitHub Actions scheduled crons are best-effort and were observed
# firing 50-95 min LATE almost every day (checked via GH API run history) --
# scheduling at 16:55 UTC (23:55 WIB) meant actual sends landed ~00:50-01:30
# WIB, past midnight. Moved the schedule earlier to 15:00 UTC (22:00 WIB) to
# absorb the typical delay and land closer to the owner's desired ~23:00 WIB.
# This is a mitigation, not a guarantee -- GH's delay is NOT deterministic. The
# real correctness fix is in lib/signalRecap.ts (recapTargetDate): the recap
# now always summarizes the correct just-ended WIB day regardless of exactly
# when it fires, so even on a still-late day the DATA is right, only the send
# time shifts.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily signal recap
        run: |
          curl -s -X POST "https://lastquestion.store/api/cron/signal-recap-daily" \
            -H "x-cron-secret: 7b8725bd97d8ee2a3c4c9f27fd320bbed065ad05efb1d66d" \
            --max-time 30 -w "\nHTTP %{http_code}\n"
